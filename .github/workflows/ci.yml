name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check review comments
        # Inline PR comments only. Skipped on pushes (reviewdog can't post there)
        # and on PRs from forks (their token is read-only). The step below is
        # what actually passes or fails the job.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: EPMatt/reviewdog-action-tsc@v1
        with:
          reporter: github-pr-review
          fail_level: none

      - name: Type check
        run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint review comments
        # Inline PR comments only. Skipped on pushes (reviewdog can't post there)
        # and on PRs from forks (their token is read-only). The step below is
        # what actually passes or fails the job.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: mongolyy/reviewdog-action-biome@v1
        with:
          reporter: github-pr-review
          fail_level: none

      - name: Lint
        run: bunx biome ci .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
